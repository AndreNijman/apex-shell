name: APEX Shell CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────────
  #  Arch Linux — pacman + AUR dry-run
  # ─────────────────────────────────────────────
  arch-validate:
    name: Arch Linux — Dependency & Lint Check
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update pacman & install base tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git base-devel python nodejs

      - name: Validate pacman dependencies exist in repos
        run: |
          PACMAN_DEPS=(
            hyprland qt6-base qt6-declarative qt6-multimedia
            qt6-5compat qt6ct pipewire pipewire-pulse wireplumber
            networkmanager bluez bluez-utils brightnessctl upower
            libnotify polkit python wl-clipboard slurp xdg-user-dirs
            wf-recorder cava imagemagick wtype lm_sensors util-linux
            hyprsunset hyprlock hyprpolkitagent hypridle
            xdg-desktop-portal-hyprland ttf-jetbrains-mono-nerd
            ttf-nerd-fonts-symbols-common hyprshutdown cliphist
          )
          FAILED=()
          for pkg in "${PACMAN_DEPS[@]}"; do
            if pacman -Si "$pkg" &>/dev/null; then
              echo "✓ $pkg"
            else
              echo "✗ $pkg (not found in repos)"
              FAILED+=("$pkg")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "Missing packages: ${FAILED[*]}"
            exit 1
          fi

      - name: Validate AUR packages exist on AUR RPC
        run: |
          AUR_DEPS=(
            quickshell-git
            awww-git
            matugen-bin
            envycontrol
            auto-cpufreq
            nbfc-linux
            grimblast-git
          )
          FAILED=()
          for pkg in "${AUR_DEPS[@]}"; do
            STATUS=$(curl -s "https://aur.archlinux.org/rpc/v5/info?arg[]=${pkg}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('ok' if d.get('resultcount',0)>0 else 'missing')")
            if [[ "$STATUS" == "ok" ]]; then
              echo "✓ $pkg (AUR)"
            else
              echo "✗ $pkg not found on AUR"
              FAILED+=("$pkg")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "Missing AUR packages: ${FAILED[*]}"
            exit 1
          fi

      - name: Lint install.sh
        run: |
          pacman -S --needed --noconfirm shellcheck
          shellcheck install.sh
          echo "✓ install.sh passed ShellCheck"

      - name: Lint dots-extra/install-arch.sh
        run: |
          bash -n dots-extra/install-arch.sh
          echo "✓ install-arch.sh syntax OK"

      - name: Lint dots-extra/validate-install.sh
        run: |
          bash -n dots-extra/validate-install.sh
          echo "✓ validate-install.sh passed ShellCheck"

      - name: Lint shell scripts in src/scripts/
        run: |
          bash -n src/scripts/GfxSwitch.sh
          bash -n src/scripts/PowerControl.sh
          shellcheck src/scripts/screenshot.sh
          echo "✓ src/scripts/ passed ShellCheck"

      - name: Assert no per-open subprocess app scan crept back
        run: |
          # The launcher enumerates apps through Quickshell's native
          # DesktopEntries index. list_apps.py was deleted because it spawned a
          # Python interpreter and rescanned every XDG applications directory on
          # every single launcher open.
          if [ -e src/scripts/list_apps.py ]; then
            echo "✗ src/scripts/list_apps.py is back; use DesktopEntries instead"
            exit 1
          fi
          # Ignore comment lines: the launcher documents what it replaced, and
          # prose about the old scanner is not a reference to it.
          if grep -rn "list_apps" --include="*.qml" src/ \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'; then
            echo "✗ QML still references list_apps"
            exit 1
          fi
          echo "✓ launcher uses native DesktopEntries"

      - name: Test launcher answer logic
        run: |
          node tests/answer-test.js

      - name: Lint test harness scripts
        run: |
          # -S warning matches the threshold apex-os uses: style/info findings in
          # a test harness are not worth failing a build over.
          shellcheck -S warning tests/*.sh
          echo "✓ test harnesses passed ShellCheck"

      - name: Service-tier behavioural test
        run: |
          # Needs a compositor; the harness skips cleanly without one so this
          # documents the entry point rather than silently not existing. Run it
          # locally in a Wayland session to actually exercise the 32 assertions.
          ./tests/run-service-tier-test.sh

      - name: Assert telemetry services stay lazy and refcounted
        run: |
          # These invariants are the whole reason the shell no longer forks at
          # idle, and all of them are one careless edit away from regressing
          # silently. A reintroduced `active: true` or a force-loaded telemetry
          # singleton costs battery with no visible symptom, so it is checked
          # here rather than left to review.
          fail=0

          for svc in CpuService MemService NetService DiskService GpuService \
                     CpuFreqService PowerProfileService BrightnessService; do
            f="src/services/system/${svc}.qml"
            [ -f "$f" ] || { echo "✗ missing $f"; fail=1; continue; }
            head -1 "$f" | grep -q '^pragma Singleton' \
              || { echo "✗ $svc is not a singleton"; fail=1; }
            grep -q "^singleton ${svc} " src/services/qmldir \
              || { echo "✗ $svc not registered as a singleton in qmldir"; fail=1; }
          done

          # Every poll timer must be gated on demand, never `running: true`.
          for svc in CpuService MemService NetService DiskService GpuService \
                     CpuFreqService PowerProfileService; do
            f="src/services/system/${svc}.qml"
            grep -q 'refCount' "$f" \
              || { echo "✗ $svc has no refCount"; fail=1; }
            if grep -nE '^\s*running:\s*true\s*$' "$f"; then
              echo "✗ $svc has an ungated timer"
              fail=1
            fi
          done

          # Telemetry singletons must NOT be force-instantiated at startup:
          # touching one starts its timer for the whole session.
          for svc in CpuService MemService NetService DiskService GpuService \
                     CpuFreqService PowerProfileService; do
            if grep -qE "property var _[A-Za-z]+:\s*${svc}\b" shell.qml; then
              echo "✗ $svc is force-loaded in shell.qml"
              fail=1
            fi
          done

          # The bug this replaced: gating a poller on an Item's own `visible`,
          # which stays true inside a hidden window.
          if grep -rnE '^\s*active:\s*(root\.)?visible\s*$' --include="*.qml" src/; then
            echo "✗ a service is gated on Item visibility instead of window visibility"
            fail=1
          fi

          # The always-mapped bar must not carry offscreen render targets.
          # Anchored to a property assignment so prose mentioning it does not
          # trip the check.
          if grep -nE '^[[:space:]]*layer\.enabled[[:space:]]*:' \
               src/modules/Center/CenterContent.qml; then
            echo "✗ the bar has a layer FBO again; use ClippingRectangle"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "✓ telemetry services are lazy, refcounted and window-gated"

      - name: Assert compositor guards are positive, not "not niri"
        run: |
          # `Connections { target: Hyprland; enabled: !Compositor.isNiri }` is
          # wrong twice over on a third compositor: !isNiri is TRUE on labwc, so
          # Hyprland handlers get enabled, and naming the Hyprland singleton as a
          # target resolves it even when disabled, which constructs it and logs
          # "cannot connect to hyprland". Both failures are invisible on
          # Hyprland, which is where the shell is usually tested.
          fail=0

          if grep -rn "enabled:.*!.*isNiri" --include="*.qml" src/; then
            echo "✗ negative compositor guard; use a positive isHyprland check"
            fail=1
          fi

          # A bare `target: Hyprland` must always be conditional.
          if grep -rnE '^\s*target:\s*Hyprland\s*$' --include="*.qml" src/; then
            echo "✗ unconditional Hyprland target; use 'isHyprland ? Hyprland : null'"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "✓ compositor guards are positive and targets are conditional"

      - name: Popup input regions must not sit outside their surface
        run: |
          # A PopupWindow's `mask` is its INPUT region. The sizer inside each
          # popup is verticalCenter-anchored, so its true top is
          # (windowHeight - sizer.height) / 2 — subtracting an extra `fh` puts
          # the clickable area above the thing it is meant to cover.
          #
          # Three popups did exactly that. Hyprland clamps an out-of-bounds
          # region leniently enough that most clicks still landed; labwc does
          # not, so the power menu rendered perfectly and ignored every click.
          # Nothing errors in either case, which is why this is a CI check and
          # not a code-review habit.
          if grep -rnE '^\s*y:.*\(.*height.*\)\s*/\s*2\s*\)?\s*-\s*root\.fh' \
               --include="*.qml" src/popups/; then
            echo "✗ a popup mask offsets its input region above its content"
            echo "  the sizer is verticalCenter-anchored; do not subtract fh"
            exit 1
          fi
          echo "✓ popup input regions align with their content"

      - name: Lazily built popups must receive the open state that built them
        run: |
          # A LazyPopup is instantiated BY the flag flipping true, so a popup
          # that only reacts to `onXOpenChanged` misses the transition that
          # created it and never maps: the notch expands over an invisible
          # window, and reopening is the only recovery. It shipped because
          # run-popup-smoke.sh cannot see it — an unmapped window still exits
          # zero and logs nothing.
          fail=0

          grep -q 'applyOpenState' src/components/LazyPopup.qml \
            || { echo "✗ LazyPopup no longer delivers state to what it builds"; fail=1; }

          # Every popup wrapped in a LazyPopup that gates itself on a
          # windowVisible flag has to expose that entry point.
          for f in NetworkPopup NotificationsPopup ClipboardPopup WallpaperPopup; do
            grep -q 'function applyOpenState' "src/popups/$f.qml" \
              || { echo "✗ src/popups/$f.qml cannot receive its first open"; fail=1; }
          done

          # The toast's own flag is written ONLY by the toast, so gating its
          # construction on that flag alone is a deadlock: no window, so no
          # listener, so nothing ever sets the flag, so toasts never appear.
          grep -q 'NotificationService.lastToast' src/popups/PopupLayer.qml \
            || { echo "✗ notification toasts are gated on a flag only they write"; fail=1; }

          [ "$fail" -eq 0 ] || exit 1
          echo "✓ lazily built popups receive their first open"

      - name: Volume and brightness binds must repeat while held
        run: |
          # Hyprland's plain `bind` fires once per press. A volume or brightness
          # key that does not repeat is technically bound and practically
          # useless, and nothing errors when the flag is lost.
          fail=0
          grep -q 'e.repeat ? "bindel" : "bind"' src/services/config_tab/KeybindService.qml \
            || { echo "✗ the keybind generator no longer emits bindel"; fail=1; }
          grep -q 'repeat: true' src/services/config_tab/KeybindService.qml \
            || { echo "✗ no bind asks to repeat; volume/brightness will single-step"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "✓ held volume and brightness keys repeat"

      - name: labwc session support is wired up
        run: |
          fail=0
          grep -q 'isLabwc' src/state/Compositor.qml \
            || { echo "✗ Compositor does not detect labwc"; fail=1; }
          # labwc has no IPC, so ext-workspace is the ONLY route to workspace
          # state. Losing this import silently empties the workspace indicator.
          grep -q 'Quickshell.WindowManager' src/modules/Left/Workspaces.qml \
            || { echo "✗ Workspaces lost the ext-workspace import"; fail=1; }
          grep -q 'visible: Compositor.isLabwc' src/modules/Left/AppDock.qml \
            || { echo "✗ labwc app dock is missing or not positively gated"; fail=1; }
          grep -q 'ToplevelManager.toplevels' src/modules/Left/AppDock.qml \
            || { echo "✗ labwc app dock lost foreign-toplevel tracking"; fail=1; }
          grep -q 'systemd-inhibit' src/state/ShellState.qml \
            || { echo "✗ labwc caffeine lost its logind inhibitor"; fail=1; }
          grep -q 'mask: Region' src/windows/TopBar.qml \
            || { echo "✗ full-width top bar can intercept titlebar controls"; fail=1; }
          grep -q 'height: Compositor.isLabwc ? Theme.borderWidth : root.implicitHeight' src/windows/TopBar.qml \
            || { echo "✗ top-bar mask no longer preserves Hyprland input behavior"; fail=1; }
          grep -q 'Math.max(Theme.notchHeight, Theme.exclusionGap)' src/windows/TopBar.qml \
            || { echo "✗ labwc bar no longer honours its exclusion-gap floor"; fail=1; }
          grep -q 'availableWidth:' src/modules/Left/LeftContent.qml \
            || { echo "✗ labwc app dock no longer respects the notch budget"; fail=1; }
          grep -q '!(Compositor.isLabwc && Popups.archMenuOpen)' src/windows/PopupDismiss.qml \
            || { echo "✗ labwc dismiss surface can intercept the power menu"; fail=1; }
          [ "$(grep -c -- '--pdeathsig' src/state/ShellState.qml)" -ge 2 ] \
            || { echo "✗ caffeine inhibitor can survive its shell parent"; fail=1; }
          ! grep -q 'nmcli monitor' src/state/ShellState.qml \
            || { echo "✗ persistent VPN monitor can leak across shell reloads"; fail=1; }
          test -x tests/run-nested-labwc.sh \
            || { echo "✗ nested-labwc harness missing or not executable"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "✓ labwc support present"

      - name: Agent Center invariants
        run: |
          fail=0

          # 1. The shell must NEVER approve a privilege request itself.
          #
          # Approving performs the operation with the user's own root, so it
          # belongs in a terminal where the prompt and the sudo authentication
          # are both visible. An [Allow] button in a status list would be one
          # unconfirmed click from an OS change, judged from a two-line
          # summary. The Agent Center therefore navigates to a terminal and
          # decides nothing — this is the check that keeps it that way.
          if grep -rnE "request (approve|allow|deny)|\bsudo\b" \
               --include="*.qml" src/services/agents/ src/services/AgentService.qml \
               | grep -vE "^[^:]+:[0-9]+:[[:space:]]*//"; then
            echo "✗ the Agent Center decides privilege requests; it must only navigate"
            fail=1
          fi

          # 2. It must go through the `apex` CLI, not the control socket.
          #
          # The CLI already handles an absent daemon and a protocol-version
          # mismatch. A second implementation of the socket protocol in QML is
          # a second thing to keep in step with every protocol change, and it
          # would drift silently.
          # The dot is escaped and comments are stripped: an unescaped
          # `control.sock` also matches the prose "control socket" in
          # AgentService's own header, which is a check that fails on its own
          # documentation.
          if grep -rnE "control\\.sock|apex-agentd/control" \
               --include="*.qml" src/services/ \
               | grep -vE "^[^:]+:[0-9]+:[[:space:]]*//"; then
            echo "✗ QML talks to the agentd socket directly; use the apex CLI"
            fail=1
          fi

          # 3. The Agent Center's parts must stay registered.
          #
          # AgentCenter is loaded THROUGH src/services/qmldir, so its own
          # directory is not on the import path and implicit sibling resolution
          # does not apply. Dropping an entry gives "RequestRow is not a type"
          # at load, which takes the whole shell down — not just the page.
          for t in AgentCenter RequestRow SessionRow SectionHeading SmallIconButton; do
            grep -qE "^${t} agents/${t}\.qml$" src/services/qmldir \
              || { echo "✗ $t is not registered in src/services/qmldir"; fail=1; }
          done
          grep -q "^singleton AgentService " src/services/qmldir \
            || { echo "✗ AgentService is not registered as a singleton"; fail=1; }

          # 4. The page must be lazy and refcounted like every other one.
          grep -q "ServiceRef" src/services/agents/AgentCenter.qml \
            || { echo "✗ the Agent Center does not hold a ServiceRef"; fail=1; }
          grep -q "refCount" src/services/AgentService.qml \
            || { echo "✗ AgentService has no refCount"; fail=1; }
          grep -q 'shown: root.page === "agents"' src/popups/Dashboard.qml \
            || { echo "✗ the Agents tab is not lazily built"; fail=1; }

          # 5. AgentService's timer is deliberately always running — it slows to
          # 15s with no refs rather than stopping, because a notification has to
          # arrive when nothing is on screen. Assert the SLOW tier exists, so
          # "always running" cannot quietly become "always running fast".
          grep -qE "refCount > 0 \? [0-9]+ : [0-9]+" src/services/AgentService.qml \
            || { echo "✗ AgentService has no two-tier poll interval"; fail=1; }

          [ "$fail" -eq 0 ] || exit 1
          echo "✓ the Agent Center navigates, does not decide, and stays lazy"

      - name: Agent Center smoke test
        run: |
          # Needs a compositor AND the apex-os runtime built; the harness skips
          # cleanly without either, so this documents the entry point rather
          # than silently not existing. Run it in a Wayland session to actually
          # exercise the page against a live runtime.
          ./tests/run-agent-center-smoke.sh

      - name: Validate QML files exist and are non-empty
        run: |
          FAILED=()
          while IFS= read -r -d '' f; do
            if [ ! -s "$f" ]; then
              echo "✗ Empty file: $f"
              FAILED+=("$f")
            else
              echo "✓ $f"
            fi
          done < <(find src -name "*.qml" -print0)
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Empty QML files found!"
            exit 1
          fi

      - name: Validate qmldir files
        run: |
          for f in $(find src -name "qmldir"); do
            echo "✓ Found qmldir: $f"
            cat "$f"
          done

  # ─────────────────────────────────────────────
  #  NixOS — flake check
  # ─────────────────────────────────────────────
  nix-validate:
    name: NixOS — Flake & Package Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Validate flake.nix syntax
        run: |
          # Check file exists and is valid UTF-8 text
          cat flake.nix > /dev/null
          # Use nix-instantiate for pure syntax check (no network, no path access)
          nix-instantiate --parse flake.nix > /dev/null
          echo "✓ flake.nix syntax OK"

      - name: Validate flake.lock structure
        run: |
          python3 -c "
          import json, sys
          with open('flake.lock') as f:
              lock = json.load(f)
          assert lock.get('version') == 7, 'Expected lock version 7'
          nodes = lock.get('nodes', {})
          print(f'Lock version: {lock[\"version\"]}')
          print(f'Nodes: {list(nodes.keys())}')
          for name, node in nodes.items():
              if 'locked' in node:
                  rev = node['locked'].get('rev', 'N/A')[:10]
                  print(f'  ✓ {name}: {rev}')
          "

      - name: Validate flake.nix declares required outputs
        run: |
          python3 -c "
          with open('flake.nix') as f:
              content = f.read()
          checks = {
            'packages':     'packages' in content,
            'devShells':    'devShells' in content,
            'nixosModules': 'nixosModules' in content,
            'description':  'description' in content,
            'apex-shell':  'apex-shell' in content,
          }
          failed = []
          for key, ok in checks.items():
              if ok:
                  print(f'  ✓ {key} declared')
              else:
                  print(f'  ✗ {key} MISSING')
                  failed.append(key)
          if failed:
              raise SystemExit(f'Missing from flake.nix: {failed}')
          "

  # ─────────────────────────────────────────────
  #  Structure Sanity Check (both runners agree)
  # ─────────────────────────────────────────────
  structure-check:
    name: Repo Structure Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          REQUIRED=(
            "shell.qml"
            "flake.nix"
            "flake.lock"
            "install.sh"
            "dots-extra/install-arch.sh"
            "dots-extra/validate-install.sh"
            "src/config/apex-shell-colors.json.example"
            "src/theme/Theme.qml"
            "src/theme/ColorLoader.qml"
            "src/state/ShellState.qml"
            "src/state/Popups.qml"
            "src/windows/TopBar.qml"
            "src/popups/Dashboard.qml"
            "src/services/answer.js"
            "tests/answer-test.js"
          )
          FAILED=()
          for f in "${REQUIRED[@]}"; do
            if [[ -f "$f" ]]; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              FAILED+=("$f")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "Missing required files: ${FAILED[*]}"
            exit 1
          fi

      - name: Count QML files per module
        run: |
          echo "QML file counts by directory:"
          find src -name "*.qml" | sed 's|/[^/]*$||' | sort | uniq -c | sort -rn

      - name: Check install.sh is executable or has correct shebang
        run: |
          head -1 install.sh | grep -q "^#!/" && echo "✓ shebang OK" || (echo "✗ Missing shebang in install.sh" && exit 1)
          head -1 dots-extra/install-arch.sh | grep -q "^#!/" && echo "✓ shebang OK (arch)" || (echo "✗ Missing shebang in install-arch.sh" && exit 1)
