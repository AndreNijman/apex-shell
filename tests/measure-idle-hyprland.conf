# Throwaway Hyprland config for tests/measure-idle-inhibit.sh.
#
# Deliberately free of exec-once: the measurement nests a second Hyprland inside
# the running session, and inheriting the user's real config would launch a
# second shell, wallpaper daemon and polkit agent inside the nest.
monitor = WL-1, 800x600@60, 0x0, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
}
