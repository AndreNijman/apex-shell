# Brain_Shell idle daemon config (hypridle).
#
# NOTE: some hypridle builds ignore -c and only read the default path, so the
# installer/user should symlink this file to ~/.config/hypr/hypridle.conf:
#   ln -sf ~/.local/src/Brain_Shell/src/config/hypridle.conf ~/.config/hypr/hypridle.conf
#
# Suspend/lock commands use elogind's loginctl (works on Void; on systemd
# distros loginctl is provided by systemd and behaves the same).
# Caffeine (QuickSettings) inhibits all of this via the Wayland idle-inhibit
# protocol — no config needed here.

general {
    # Brain_Shell's own lock screen (WlSessionLock + PAM), via shell IPC.
    lock_cmd = qs -c ~/.local/src/Brain_Shell ipc call lockscreen lock
    # Lock before the machine suspends (fires on loginctl suspend too).
    before_sleep_cmd = loginctl lock-session
    # Wake the display on resume so no extra keypress is needed.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min — dim the backlight (restored on activity).
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5.5 min — lock the session (elogind emits Lock → lock_cmd above).
listener {
    timeout = 330
    on-timeout = loginctl lock-session
}

# 6 min — display off.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 15 min — suspend.
listener {
    timeout = 900
    on-timeout = loginctl suspend
}
