# apex-shell idle daemon config (hypridle).
#
# NOTE: some hypridle builds ignore -c and only read the default path, so the
# installer/user should symlink this file to ~/.config/hypr/hypridle.conf:
#   ln -sf ~/.local/src/apex-shell/src/config/hypridle.conf ~/.config/hypr/hypridle.conf
#
# Suspend/lock commands use elogind's loginctl (works on Void; on systemd
# distros loginctl is provided by systemd and behaves the same).
# Caffeine (QuickSettings) inhibits all of this with a logind `idle` block
# inhibitor, held on every compositor — no config change is needed here.
# hypridle honours that lock (measured: held -> no listener fires; released ->
# they fire). The shell ALSO holds a Wayland surface inhibitor, but Hyprland
# ignores those on layer-shell surfaces, so on Hyprland the logind lock is the
# only thing stopping this file. See tests/measure-idle-inhibit.sh.

general {
    # apex-shell's own lock screen (WlSessionLock + PAM), via shell IPC.
    lock_cmd = qs -c ~/.local/src/apex-shell ipc call lockscreen lock
    # Lock before the machine suspends (fires on loginctl suspend too).
    before_sleep_cmd = loginctl lock-session
    # Wake the display on resume so no extra keypress is needed.
    # DpmsControl.sh picks hyprctl (Hyprland) or `niri msg action power-*-monitors`
    # (niri) from the environment, so this one file works under either compositor.
    after_sleep_cmd = ~/.local/src/apex-shell/src/scripts/DpmsControl.sh on
}

# 5 min — dim the backlight (restored on activity).
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5.5 min — lock the session (elogind emits Lock → lock_cmd above).
listener {
    timeout = 330
    on-timeout = loginctl lock-session
}

# 6 min — display off. DpmsControl.sh is compositor-neutral (Hyprland / niri).
listener {
    timeout = 360
    on-timeout = ~/.local/src/apex-shell/src/scripts/DpmsControl.sh off
    on-resume = ~/.local/src/apex-shell/src/scripts/DpmsControl.sh on
}

# 15 min — suspend.
listener {
    timeout = 900
    on-timeout = loginctl suspend
}
